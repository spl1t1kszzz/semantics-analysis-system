app-config:
  use-dict: true
  device: 'cpu'
  display-graph: true
  show-term-predictions: false
  show-class-predictions: false
  llm: 'gpt-5.2'
  show-explanation: false
  split-on-sentences: false
  log-prompts: false
  log-llm-responses: false
  use-multi-agent: true
  # Двухшаговый диалог при разрешении конфликтов (сначала обоснование, потом выбор)
  use-conflict-dialogue: true
  # Повторная верификация выбранного отношения через LLM после разрешения конфликта
  use-reverify-after-resolve: true
