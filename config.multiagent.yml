# Мультиагентный режим: multi-probe fallback + разрешение конфликтов (re-verify).

app-config:
  use-dict: true
  device: 'cpu'
  term-threshold: 0.2
  class-threshold: 0.5

  llm: 'qwen2.5:7b'
  max-term-distance: 300

  use-multi-agent: true
  use-conflict-dialogue: true
  use-reverify-after-resolve: true

  display-graph: true
  show-term-predictions: false
  show-class-predictions: false
  show-explanation: false
  split-on-sentences: false

  log-prompts: false
  log-llm-responses: false
